<rect width="1600" height="720" fill="#0F1A15"/><rect width="1600" height="104" fill="#13241C"/><text x="40" y="52" fill="#6FD39E" font-size="32" font-weight="700">ARQUITECTURA MVVM · MI MARKET</text><text x="40" y="82" fill="#9FB5AA" font-size="16">Compose + ViewModel/StateFlow + repositorio fachada + Firebase (Auth, Firestore, Storage) + Google Maps y ubicación</text><rect x="40.0" y="140" width="350.0" height="480" rx="14" fill="#2E7D5B22" stroke="#2E7D5B" stroke-width="2"/><text x="58.0" y="176" fill="#E8F1EC" font-size="19" font-weight="700">1. VISTA</text><text x="58.0" y="200" fill="#9FB5AA" font-size="14">Jetpack Compose</text><rect x="54.0" y="224" width="322.0" height="190" rx="10" fill="#2E7D5B55" stroke="#2E7D5B" stroke-width="1"/><text x="70.0" y="254" fill="#FFFFFF" font-size="16" font-weight="700">Pantallas</text><text x="70.0" y="280" fill="#E8F1EC" font-size="13.5">• LoginScreen · RegistroScreen</text><text x="70.0" y="304" fill="#E8F1EC" font-size="13.5">• CatalogoScreen · CarritoScreen</text><text x="70.0" y="328" fill="#E8F1EC" font-size="13.5">• ProductoFormScreen</text><text x="70.0" y="352" fill="#E8F1EC" font-size="13.5">• TiendasMapaScreen</text><text x="70.0" y="376" fill="#E8F1EC" font-size="13.5">• PerfilScreen · PedidosScreen</text><text x="70.0" y="400" fill="#E8F1EC" font-size="13.5">• PrivacidadScreen</text><rect x="54.0" y="436" width="322.0" height="142" rx="10" fill="#2E7D5B55" stroke="#2E7D5B" stroke-width="1"/><text x="70.0" y="466" fill="#FFFFFF" font-size="16" font-weight="700">Navegación y componentes</text><text x="70.0" y="492" fill="#E8F1EC" font-size="13.5">• MainActivity (una sola Activity)</text><text x="70.0" y="516" fill="#E8F1EC" font-size="13.5">• MiMarketNavHost + Rutas</text><text x="70.0" y="540" fill="#E8F1EC" font-size="13.5">• Componentes.kt (logo, campos, botones)</text><text x="70.0" y="564" fill="#E8F1EC" font-size="13.5">• MiMarketTheme (Material 3)</text><line x1="394.0" y1="370" x2="424.0" y2="370" stroke="#6FD39E" stroke-width="3" marker-end="url(#fv)"/><line x1="426.0" y1="410" x2="396.0" y2="410" stroke="#F28C28" stroke-width="3" marker-end="url(#fn)"/><rect x="430.0" y="140" width="350.0" height="480" rx="14" fill="#1F6F8B22" stroke="#1F6F8B" stroke-width="2"/><text x="448.0" y="176" fill="#E8F1EC" font-size="19" font-weight="700">2. VIEWMODEL</text><text x="448.0" y="200" fill="#9FB5AA" font-size="14">Estado con StateFlow</text><rect x="444.0" y="224" width="322.0" height="166" rx="10" fill="#1F6F8B55" stroke="#1F6F8B" stroke-width="1"/><text x="460.0" y="254" fill="#FFFFFF" font-size="16" font-weight="700">ViewModels</text><text x="460.0" y="280" fill="#E8F1EC" font-size="13.5">• AuthViewModel</text><text x="460.0" y="304" fill="#E8F1EC" font-size="13.5">• CatalogoViewModel (carrito)</text><text x="460.0" y="328" fill="#E8F1EC" font-size="13.5">• ProductoFormViewModel</text><text x="460.0" y="352" fill="#E8F1EC" font-size="13.5">• TiendasViewModel</text><text x="460.0" y="376" fill="#E8F1EC" font-size="13.5">• PerfilViewModel</text><rect x="444.0" y="412" width="322.0" height="142" rx="10" fill="#1F6F8B55" stroke="#1F6F8B" stroke-width="1"/><text x="460.0" y="442" fill="#FFFFFF" font-size="16" font-weight="700">Estados de la UI</text><text x="460.0" y="468" fill="#E8F1EC" font-size="13.5">• EstadoUi: Inactivo · Cargando · Exito · Error</text><text x="460.0" y="492" fill="#E8F1EC" font-size="13.5">• EstadoUbicacion: Cargando · Obtenida</text><text x="460.0" y="516" fill="#E8F1EC" font-size="13.5">• PermisoDenegado · GpsDesactivado · Error</text><text x="460.0" y="540" fill="#E8F1EC" font-size="13.5">• Validaciones y mensajes en español</text><line x1="784.0" y1="370" x2="814.0" y2="370" stroke="#6FD39E" stroke-width="3" marker-end="url(#fv)"/><line x1="816.0" y1="410" x2="786.0" y2="410" stroke="#F28C28" stroke-width="3" marker-end="url(#fn)"/><rect x="820.0" y="140" width="350.0" height="480" rx="14" fill="#8A5A1222" stroke="#8A5A12" stroke-width="2"/><text x="838.0" y="176" fill="#E8F1EC" font-size="19" font-weight="700">3. REPOSITORIO</text><text x="838.0" y="200" fill="#9FB5AA" font-size="14">Fachada única</text><rect x="834.0" y="224" width="322.0" height="142" rx="10" fill="#8A5A1255" stroke="#8A5A12" stroke-width="1"/><text x="850.0" y="254" fill="#FFFFFF" font-size="16" font-weight="700">MiMarketRepository</text><text x="850.0" y="280" fill="#E8F1EC" font-size="13.5">• Sesión, catálogo, pedidos y perfil</text><text x="850.0" y="304" fill="#E8F1EC" font-size="13.5">• Sube imagen y luego guarda el producto</text><text x="850.0" y="328" fill="#E8F1EC" font-size="13.5">• Consentimiento de ubicación</text><text x="850.0" y="352" fill="#E8F1EC" font-size="13.5">• Eliminar cuenta y datos</text><rect x="834.0" y="388" width="322.0" height="142" rx="10" fill="#8A5A1255" stroke="#8A5A12" stroke-width="1"/><text x="850.0" y="418" fill="#FFFFFF" font-size="16" font-weight="700">Soporte</text><text x="850.0" y="444" fill="#E8F1EC" font-size="13.5">• Resultado&lt;T&gt;: Exito · Fallo</text><text x="850.0" y="468" fill="#E8F1EC" font-size="13.5">• TraductorErrores (códigos Firebase)</text><text x="850.0" y="492" fill="#E8F1EC" font-size="13.5">• Dependencias + MiMarketApp</text><text x="850.0" y="516" fill="#E8F1EC" font-size="13.5">• Modelos: Producto, Usuario, Pedido</text><line x1="1174.0" y1="370" x2="1204.0" y2="370" stroke="#6FD39E" stroke-width="3" marker-end="url(#fv)"/><line x1="1206.0" y1="410" x2="1176.0" y2="410" stroke="#F28C28" stroke-width="3" marker-end="url(#fn)"/><rect x="1210.0" y="140" width="350.0" height="480" rx="14" fill="#6B3FA022" stroke="#6B3FA0" stroke-width="2"/><text x="1228.0" y="176" fill="#E8F1EC" font-size="19" font-weight="700">4. DATOS</text><text x="1228.0" y="200" fill="#9FB5AA" font-size="14">Fuentes remotas y locales</text><rect x="1224.0" y="224" width="322.0" height="142" rx="10" fill="#6B3FA055" stroke="#6B3FA0" stroke-width="1"/><text x="1240.0" y="254" fill="#FFFFFF" font-size="16" font-weight="700">data/remote</text><text x="1240.0" y="280" fill="#E8F1EC" font-size="13.5">• FirebaseAuthManager</text><text x="1240.0" y="304" fill="#E8F1EC" font-size="13.5">• FirestoreRepository (snapshots)</text><text x="1240.0" y="328" fill="#E8F1EC" font-size="13.5">• StorageRepository</text><text x="1240.0" y="352" fill="#E8F1EC" font-size="13.5">• LocationRepository (Fused + Geocoder)</text><rect x="1224.0" y="388" width="322.0" height="142" rx="10" fill="#6B3FA055" stroke="#6B3FA0" stroke-width="1"/><text x="1240.0" y="418" fill="#FFFFFF" font-size="16" font-weight="700">data/local y nube</text><text x="1240.0" y="444" fill="#E8F1EC" font-size="13.5">• PreferenciasPrivacidad</text><text x="1240.0" y="468" fill="#E8F1EC" font-size="13.5">• ProcesadorImagenes (JPEG 1280 px)</text><text x="1240.0" y="492" fill="#E8F1EC" font-size="13.5">• Firebase: Auth · Firestore · Storage</text><text x="1240.0" y="516" fill="#E8F1EC" font-size="13.5">• Google Maps SDK (clave restringida)</text><rect x="40" y="650" width="1520" height="40" rx="8" fill="#13241C"/><line x1="64" y1="670" x2="104" y2="670" stroke="#6FD39E" stroke-width="3"/><text x="114" y="675" fill="#6FD39E" font-size="14">Acciones del usuario y llamadas (suspend)</text><line x1="460" y1="670" x2="500" y2="670" stroke="#F28C28" stroke-width="3"/><text x="510" y="675" fill="#F28C28" font-size="14">Datos en tiempo real (Flow) y Resultado traducido a EstadoUi</text>
</svg>